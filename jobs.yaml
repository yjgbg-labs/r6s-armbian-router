version: 1

jobs:
  - name: test
    run: ./scripts/test.sh

  - name: host-check
    run: ./scripts/check-host.sh

  - name: prepare
    needs: [test]
    run: ./scripts/prepare-build.sh

  - name: build
    needs: [prepare, host-check]
    run: ./scripts/build-image.sh

  - name: package
    needs: [build]
    run: ./scripts/package-image.sh

  - name: upload
    needs: [package]
    run: ./scripts/upload-image.sh

  - name: flash
    needs: [package]
    run: ./scripts/flash-image.sh

  - name: mihomo-package
    needs: [test]
    run: ./scripts/package-mihomo.sh

  - name: mihomo-upload
    needs: [mihomo-package]
    run: ./scripts/upload-mihomo.sh

  - name: runtime-package
    needs: [test]
    run: ./scripts/package-runtime.sh

  - name: runtime-upload
    needs: [runtime-package]
    run: ./scripts/upload-runtime.sh

  - name: runtime-sync
    needs: [runtime-upload]
    run: ./scripts/sync-runtime.sh
